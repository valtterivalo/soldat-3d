name: Soldat 3D
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libzstd-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libwayland-dev libxkbcommon-dev
      - name: Test simulation
        run: |
          cmake -S client3d -B build/tests -DSOLDAT3D_RENDERER=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-sanitize-recover=all"
          cmake --build build/tests --parallel
          ctest --test-dir build/tests --output-on-failure --parallel "$(nproc)"
      - name: Build native client
        run: |
          cmake -S client3d -B build/client -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/client --parallel --target soldat3d
      - name: Test server image
        run: |
          docker build -t soldat-3d .
          docker run --rm soldat-3d --map ctf_Ash --mode ctf --bots 6 --ticks 120
